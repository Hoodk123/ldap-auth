services:
  openldap:
    build:
      context: ./openldap
      dockerfile: Dockerfile
    image: hoodk/openldap-hardened:latest
    container_name: openldap
    ports:
      - "1389:1389"
    environment:
      - LDAP_ADMIN_USERNAME=${LDAP_ADMIN_USERNAME}
      - LDAP_ADMIN_PASSWORD=${LDAP_ADMIN_PASSWORD}
      - LDAP_USERS=john,jane
      - LDAP_PASSWORDS=${LDAP_USERS_PASSWORDS},${LDAP_USERS_PASSWORDS}
      - LDAP_ROOT=${LDAP_ROOT}
    networks:
      - auth-network
  
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8080:8080"
    environment:
      - LDAP_HOST=${LDAP_HOST}
      - LDAP_PORT=${LDAP_PORT}
      - LDAP_ADMIN_USERNAME=${LDAP_ADMIN_USERNAME}
      - LDAP_ADMIN_PASSWORD=${LDAP_ADMIN_PASSWORD}
      - LDAP_ROOT=${LDAP_ROOT}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - openldap
    networks:
      - auth-network

  prometheus-init:
    image: busybox
    container_name: prometheus-init
    user: root
    volumes:
      - prometheus-data:/prometheus
    command: chown -R 65534:65534 /prometheus
    restart: "no" #runs once and exits then
    networks:
      - auth-network
  

  prometheus:
      image: dhi.io/prometheus:3.9
      container_name: prometheus
      user: "65534:65534"
      depends_on:
        prometheus-init:
          condition: service_completed_successfully
      ports:
        - "9090:9090"    
      volumes:
        - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        - prometheus-data:/prometheus
      command:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        - '--storage.tsdb.retention.time=7d'
        - '--web.console.libraries=/etc/prometheus/console_libraries'
        - '--web.console.templates=/etc/prometheus/consoles'
      networks:
        - auth-network

  grafana:
    image: dhi.io/grafana:12-debian13-dev
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - auth-network

networks:
  auth-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:

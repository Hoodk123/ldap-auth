services:
  openldap:
    image: symas/openldap:latest
    container_name: openldap
    ports:
      - "1389:1389"
    environment:
      - LDAP_ADMIN_USERNAME=${LDAP_ADMIN_USERNAME}
      - LDAP_ADMIN_PASSWORD=${LDAP_ADMIN_PASSWORD}
      - LDAP_USERS=john,jane
      - LDAP_PASSWORDS=${LDAP_USERS_PASSWORDS},${LDAP_USERS_PASSWORDS}
      - LDAP_ROOT=${LDAP_ROOT}
    networks:
      - auth-network
  
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
     - "8080:8080"
    environment:
      - LDAP_HOST=${LDAP_HOST}
      - LDAP_PORT=${LDAP_PORT}
      - LDAP_ADMIN_USERNAME=${LDAP_ADMIN_USERNAME}
      - LDAP_ADMIN_PASSWORD=${LDAP_ADMIN_PASSWORD}
      - LDAP_ROOT=${LDAP_ROOT}
    depends_on:
      - openldap
    networks:
      - auth-network

networks:
  auth-network:
    driver: bridge
